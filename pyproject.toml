[project]
name = "astra"
version = "1.0.0"
description = "Astra: a small, self-improving language model stack"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tools/birth_test.py" = ["BLE001"]
