[package]
name = "astra-rt"
version = "0.5.0"
edition = "2021"
description = "Astra Rust runtime — checkpoint fingerprint + memory vector core (Phase 4)"
license = "MIT"

[dependencies]
# Minimal deps: serde for JSON parsing of Python store files.
# sha256 + memory modules are self-contained (no external deps).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# none; tests use only std + serde_json